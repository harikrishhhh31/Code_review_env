# =============================================================================
# pyproject.toml - Python Project Configuration
# =============================================================================
#
# This file defines:
# - Project metadata (name, version, description)
# - Dependencies (what packages are needed)
# - Build configuration
# - Development tools (testing, linting)
#
# LEARNING: Why pyproject.toml?
# It's the modern standard for Python packaging (replaces setup.py, requirements.txt).
# It tells:
# - pip: What to install
# - uv: How to manage dependencies
# - tools: How to run tests/linting
#
# =============================================================================

[project]
# Project identity
name = "code-review-env"
version = "1.0.0"
description = "AI-powered code review environment for RL training"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Code Review Env Team", email = "contact@example.com"}
]
keywords = [
    "reinforcement-learning",
    "code-review",
    "openenv",
    "agent-training"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]

# Dependencies
# These are required to run the environment
dependencies = [
    "openenv>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0.0",
]

# Console scripts
[project.scripts]
server = "server.app:main"
code-review-env-server = "server.app:main"

# Optional dependencies
[project.optional-dependencies]
# For running the baseline inference
dev = [
    "openai>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
# For linting and formatting
lint = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

# Build system
# Tells pip/build how to package this project
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package configuration
# Tells hatchling what files to include
[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/openenv.yaml",
]

# =============================================================================
# TOOL CONFIGURATIONS
# =============================================================================

# Ruff (fast linter)
[tool.ruff]
# Enable pyflakes and pycodestyle rules
select = ["E", "F", "I"]
# Ignore specific rules
ignore = [
    "E501",  # Line too long (handled by formatter)
]
# Auto-fix where possible
fix = true

[tool.ruff.per-file-ignores]
# Ignore import order in __init__.py
"__init__.py" = ["E402", "F401"]

# MyPy (type checker)
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

# Pytest (test runner)
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

# =============================================================================
# UV CONFIGURATION (for fast dependency management)
# =============================================================================

# This section is used by the `uv` package manager
# It's optional but recommended for faster installs

[tool.uv]
# Keep a lock file for reproducible builds
# lockfile = "uv.lock"
