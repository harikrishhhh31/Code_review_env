
name: code_review_env

version: "1.0.0"

description: >
  AI-powered code review environment where agents analyze pull requests,
  identify bugs, security issues, and readability problems.

long_description: |
  CodeReviewEnv is a reinforcement learning environment for training
  code review agents. Agents learn to:
  
  - Review code for readability issues (naming, comments, structure)
  - Identify logic bugs and errors
  - Detect security vulnerabilities
  - Verify code matches PR description
  
  
  Identify code style and clarity issues. Perfect for learning basic
  code quality assessment.
  
  Find logic errors and bugs in code. Requires understanding what the
  code SHOULD do vs what it actually does.
  
  Complete code review including security analysis and verification
  that code matches its stated purpose.
  
  
  Dense rewards (reward at each step) help agents learn efficiently.
  Partial credit is given for identifying issues correctly.
  
  
  ```python
  from code_review_env import CodeReviewEnv, CodeReviewAction
  
  env = CodeReviewEnv()
  obs = env.reset(task_id="readability")
  
  action = CodeReviewAction(
      review_text="Found 2 issues: ...",
      findings=[{"type": "readability", "location": "line 1", ...}]
  )
  
  result = env.step(action)
  print(f"Score: {result.cumulative_score}")
  ```

author:
  name: "Code Review Env Team"
  email: "contact@example.com"
  github: "https://github.com/example/code-review-env"

license: MIT

tags:
  - code-review
  - software-engineering
  - security
  - reinforcement-learning
  - openenv
  - pull-request
  - python


tasks:
  - id: readability
    name: "Readability Review"
    difficulty: easy
    description: |
      Review code for readability issues including:
      - Poor variable/function names
      - Missing documentation
      - Complex logic that could be simplified
      - Missing type hints
    max_steps: 10
    reward_scale: 1.0
    
  - id: bug_logic
    name: "Bug & Logic Review"
    difficulty: medium
    description: |
      Find logic errors and bugs in code:
      - Off-by-one errors
      - Missing edge case handling
      - Incorrect algorithms
      - Race conditions
    max_steps: 10
    reward_scale: 1.0
    
  - id: full_review
    name: "Full Pull Request Review"
    difficulty: hard
    description: |
      Complete code review including:
      - Readability issues
      - Logic bugs
      - Security vulnerabilities
      - Verification that code matches PR description
    max_steps: 10
    reward_scale: 1.0


runtime:
  python_version: "3.11"
  
  dependencies:
    - openenv>=0.1.0
    - fastapi>=0.100.0
    - uvicorn>=0.23.0
    - pydantic>=2.0.0


action:
  fields:
    - name: review_text
      type: string
      description: "The agent's code review as natural language"
    - name: findings
      type: array
      description: "Structured list of issues found"
      items:
        type: object
        properties:
          type:
            type: string
            enum: [readability, logic, security, other]
          severity:
            type: string
            enum: [low, medium, high, critical]
          location:
            type: string
            description: "Where in the code (e.g., 'line 5')"
          description:
            type: string
            description: "What's wrong"
          suggestion:
            type: string
            description: "How to fix (optional)"

observation:
  fields:
    - name: pr_info
      type: object
      description: "Pull Request information (title, code, etc.)"
    - name: feedback
      type: string
      description: "Feedback on the agent's review"
    - name: score_breakdown
      type: object
      description: "Detailed scoring by category"
    - name: reward
      type: float
      description: "Reward for this step (-1.0 to 1.0)"
    - name: cumulative_score
      type: float
      description: "Running total of all rewards"
    - name: done
      type: boolean
      description: "Whether episode is complete"


deployment:
  container:
    port: 8000
    health_check_path: /health
    
  huggingface:
    sdk: docker
    
    hardware: "basic"  # or "cpu-basic", "cpu-upgrade", "t4-small"
    
    config:
      app_port: 8000
      
      title: "CodeReviewEnv"
      description: "AI-powered code review environment"
      emoji: "code_review"
      color_from: "blue"
      color_to: "green"


validation:
  required_files:
    - models.py
    - rubric.py
    - server/code_review_env.py
    - server/app.py
    - Dockerfile
    - openenv.yaml
    - README.md
    - inference.py
    
  min_tasks: 3
  
  required_methods:
    - reset
    - step
    - state
  
  tests:
    sanity_check: true
    
    has_examples: true
